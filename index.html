<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tower Sim</title>
  <style>
    /* No page scrollbars, no default margin — the canvas should fill the window. */
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: sans-serif;
    }
    canvas {
      display: block;
    }

    #topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 16px;
      background: rgba(20, 20, 20, 0.55);
      color: #fff;
      font-size: 14px;
      z-index: 10;
    }
    #money {
      font-weight: bold;
      font-variant-numeric: tabular-nums;
    }
    #money.in-debt,
    #debt {
      color: #ff9d9d;
    }
    #ledger {
      color: #ccc;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }
    #debt {
      font-weight: bold;
    }
    #hint {
      color: #eee;
    }
    #hint.hint-error {
      color: #ff9d9d;
      font-weight: bold;
    }

    #clockbar {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #clock-label {
      font-variant-numeric: tabular-nums;
      min-width: 9em;
      text-align: center;
    }
    #clockbar button {
      padding: 3px 8px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      font-size: 12px;
      cursor: pointer;
    }
    #clockbar button:hover {
      background: rgba(255, 255, 255, 0.18);
    }
    #clockbar button.active {
      background: #3ea45c;
      border-color: #3ea45c;
    }

    #toolbar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 8px;
      background: rgba(20, 20, 20, 0.55);
      z-index: 10;
    }
    #toolbar button {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 6px 10px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      font-size: 12px;
      cursor: pointer;
    }
    #toolbar button:hover {
      background: rgba(255, 255, 255, 0.18);
    }
    #toolbar button.active {
      background: #3ea45c;
      border-color: #3ea45c;
    }
    #toolbar button small {
      color: #ccc;
      font-size: 10px;
    }
    #toolbar button.active small {
      color: #eaffea;
    }

    #gameover {
      position: fixed;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      text-align: center;
      z-index: 20;
    }
    #gameover.shown {
      display: flex;
    }
    #gameover h1 {
      margin: 0;
      font-size: 40px;
      color: #ff9d9d;
    }
    #gameover button {
      padding: 8px 18px;
      border: none;
      border-radius: 6px;
      background: #3ea45c;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="topbar">
    <span>
      <span id="money"></span> <span id="ledger"></span> <span id="debt"></span>
      &nbsp; <span id="population"></span>
    </span>
    <div id="clockbar">
      <span id="clock-label"></span>
      <button id="pause-btn">Pause</button>
      <button class="speed-btn active" data-speed="1">1x</button>
      <button class="speed-btn" data-speed="3">3x</button>
    </div>
    <span id="hint"></span>
  </div>

  <canvas id="game"></canvas>

  <div id="gameover">
    <h1>Bankrupt</h1>
    <p>The tower spent a whole week in the red, and the bank has taken it back.</p>
    <button id="restart-btn">Start over</button>
  </div>

  <div id="toolbar">
    <button data-tool="floor">Floor<small>$200/tile</small></button>
    <button data-tool="lobby">Lobby<small>Free</small></button>
    <button data-tool="sewing">Sewing<small>$9,000 · rent $1.6k/day</small></button>
    <button data-tool="pottery">Pottery<small>$11,000 · rent $1.8k/day</small></button>
    <button data-tool="woodwork">Woodwork<small>$10,000 · rent $1.3k/day</small></button>
    <button data-tool="jewellery">Jewellery<small>$15,000 · rent $2.5k/day</small></button>
    <button data-tool="condo">Condo<small>$20,000 · sells $30k</small></button>
    <button data-tool="stairs">Stairs<small>$5,000</small></button>
    <button data-tool="elevator">Elevator<small>drag · $20k + $1k/floor · $1k/day</small></button>
    <button data-tool="demolish">Demolish<small>refund 50%</small></button>
  </div>

  <script src="grid.js"></script>
  <script src="camera.js"></script>
  <script src="clock.js"></script>
  <script src="rooms.js"></script>
  <script src="world.js"></script>
  <script src="routing.js"></script>
  <script src="elevators.js"></script>
  <script src="people.js"></script>
  <script src="economy.js"></script>
  <script src="input.js"></script>
  <script src="ui.js"></script>
  <script src="render.js"></script>
  <script src="main.js"></script>
</body>
</html>
